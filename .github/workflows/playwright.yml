name: k6 Load Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: lts/*
        
    - name: Install dependencies
      run: npm install -g pnpm && pnpm install
      
    - name: Bundle TypeScript into JavaScript
      run: pnpm run bundle

    - name: Setup k6
      uses: grafana/setup-k6-action@v1
      
    - name: Run k6 Smoke Test
      # GitHub will automatically inject your secret URL here during the run
      run: k6 run -e PROFILE=smoke -e BASE_URL=${{ secrets.BASE_URL }} dist/main.js